<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<defs>
  <linearGradient id="anvilG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#c8d8e0"/>
    <stop offset="100%" style="stop-color:#8aaab8"/>
  </linearGradient>
  <linearGradient id="baseG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#4eb7b3"/>
    <stop offset="100%" style="stop-color:#3b8ea0"/>
  </linearGradient>
  <linearGradient id="hamG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#e8a050"/>
    <stop offset="100%" style="stop-color:#d4752a"/>
  </linearGradient>
</defs>
<!-- Anvil base -->
<rect x="4" y="23" width="18" height="4" rx="1.5" fill="url(#baseG)"/>
<!-- Anvil body -->
<rect x="6" y="17" width="16" height="7" rx="1.5" fill="url(#anvilG)"/>
<!-- Anvil top -->
<rect x="5" y="15" width="18" height="3" rx="1" fill="#dce8ee"/>
<!-- Horn -->
<polygon points="6,19 2,21 2,23 6,22" fill="#b0c8d4"/>
<!-- Hammer handle -->
<rect x="18" y="6" width="3" height="10" rx="1.5" fill="#c4a882" transform="rotate(-35, 19, 11)"/>
<!-- Hammer head -->
<rect x="14" y="4" width="9" height="5" rx="2" fill="url(#hamG)" transform="rotate(-35, 18, 6)"/>
<!-- Sparks -->
<line x1="17" y1="15" x2="12" y2="10" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
<line x1="17" y1="15" x2="10" y2="13" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
<line x1="17" y1="15" x2="13" y2="8" stroke="#f97316" stroke-width="1" stroke-linecap="round"/>
<circle cx="12" cy="10" r="1.2" fill="#fbbf24"/>
<circle cx="10" cy="13" r="1" fill="#fde68a"/>
<circle cx="13" cy="8" r="1" fill="#f97316"/>
</svg>
